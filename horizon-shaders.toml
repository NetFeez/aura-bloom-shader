schema = 1
id = "aurora_bloom"
name = "Aurora Bloom"
version = "0.1.0"
api = "0.2"
description = "A prettier sky by day and night, cooler rippling water and a gentle bloom-like grade over the whole world."
authors = ["NetFeez"]
license = "Apache-2.0"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Aurora sky"

[material]
file = "material.wgsl"
name = "Water and blocks"

[entity]
file = "entity.wgsl"

[tonemap]
file = "tonemap.wgsl"
name = "Aurora grade"

[reflection]
option = "preset"

# The same palette as the Aurora Lights companion shader pack: the mod's "Light colors" switch gates whether the
# material reads it, so turning that setting off restores plain white block light.
[[lights]]
color = [1.0, 1.0, 1.0]
blocks = ["beacon", "conduit", "glowstone", "lava_cauldron", "furnace", "blast_furnace", "smoker", "ender_chest", "end_portal_frame", "calibrated_sculk_sensor", "brewing_stand", "brown_mushroom", "dragon_egg", "light"]

[[lights]]
color = [0.807843, 0.321569, 0.278431]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [0.960784, 0.674510, 0.482353]
blocks = ["torch", "wall_torch", "lantern", "fire", "campfire"]

[[lights]]
color = [0.858824, 0.607843, 0.317647]
blocks = ["jack_o_lantern", "lava", "shroomlight", "cave_vines", "cave_vines_plant", "magma_block", "vault", "trial_spawner", "candle*", "*_candle", "*_candle_cake"]

[[lights]]
color = [0.925490, 0.807843, 0.670588]
blocks = ["redstone_lamp", "copper_bulb", "*_copper_bulb", "*_copper_lantern", "firefly_bush"]

[[lights]]
color = [0.611765, 0.831373, 0.466667]
blocks = ["copper_lantern", "copper_torch"]

[[lights]]
color = [0.980392, 0.949020, 0.709804]
blocks = ["ochre_froglight"]

[[lights]]
color = [0.768627, 0.956863, 0.784314]
blocks = ["verdant_froglight", "glow_lichen"]

[[lights]]
color = [0.882353, 0.549020, 0.894118]
blocks = ["pearlescent_froglight", "end_rod"]

[[lights]]
color = [0.745098, 0.882353, 0.858824]
blocks = ["sea_lantern", "sea_pickle"]

[[lights]]
color = [0.352941, 0.878431, 0.917647]
blocks = ["soul_lantern", "soul_torch", "soul_wall_torch", "soul_campfire", "soul_fire", "sculk_catalyst", "sculk_sensor"]

[[lights]]
color = [0.525490, 0.541176, 0.752941]
blocks = ["end_gateway", "end_portal"]

[[lights]]
color = [0.701961, 0.345098, 0.937255]
blocks = ["respawn_anchor", "nether_portal", "crying_obsidian", "enchanting_table"]

[[lights]]
color = [0.776471, 0.509804, 0.925490]
blocks = ["amethyst_cluster", "*_amethyst_bud"]

[[options]]
id = "preset"
name = "Presets"
description = "Quality preset for every cosmetic effect. only lights keeps Aurora Lights glow but skips sky, water and grade; low, normal and enhanced enable progressively more effects. Individual switches still fine-tune the result."
type = "choice"
values = ["only lights", "low", "normal", "enhanced"]
default = "enhanced"

[[options]]
id = "sky_tint"
name = "Deeper sky"
description = "Deep blue day and violet night tint over vanilla's sky colour."
type = "bool"
default = true

[[options]]
id = "sun_glow_enabled"
name = "Enable sun glow"
description = "Warm halo around the sun, strongest at sunrise and sunset."
type = "bool"
default = true

[[options]]
id = "moon_glow_enabled"
name = "Enable moon glow"
description = "Soft halo around the moon at night."
type = "bool"
default = true

[[options]]
id = "stars_enabled"
name = "Enable stars"
description = "Twinkling stars in the night sky."
type = "bool"
default = true

[[options]]
id = "luceros_enabled"
name = "Enable bright stars"
description = "Rare pulsing stars with a small cross flare."
type = "bool"
default = true

[[options]]
id = "aurora_enabled"
name = "Enable aurora"
description = "Slow night-time aurora curtains."
type = "bool"
default = true

[[options]]
id = "sun_glow"
name = "Sun glow"
description = "Warm halo around the sun, strongest at sunrise and sunset."
type = "float"
default = 0.55
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "aurora_strength"
name = "Aurora"
description = "Brightness of the night-time aurora curtains."
type = "float"
default = 0.75
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "star_density"
name = "Star density"
description = "How many stars the night sky carries (0 turns them off)."
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 1.0

[[options]]
id = "lucero_strength"
name = "Bright stars"
description = "Brightness of the few bright stars that pulse and flare."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "block_saturation_enabled"
name = "Enable block saturation"
description = "Small colour lift on every block."
type = "bool"
default = true

[[options]]
id = "aurora_lights_enabled"
name = "Aurora Lights glow"
description = "Apply the mod's held, dropped, framed, enchanted and placed colored light to blocks, water and entities."
type = "bool"
default = true

[[options]]
id = "world_saturation"
name = "World saturation"
description = "A small colour lift on every block."
type = "float"
default = 1.06
min = 0.8
max = 1.4
step = 0.02

[[options]]
id = "water_saturation"
name = "Water saturation"
description = "How deep the water's blue-green reads."
type = "float"
default = 1.12
min = 0.8
max = 1.6
step = 0.02

[[options]]
id = "water_ripple"
name = "Water ripple"
description = "Strength of the slow waves under the reflection and glitter."
type = "float"
default = 0.45
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "water_reflection_reach"
name = "Interior reflection reach"
description = "How high above the water the interior scene is sampled. Raise it if reflected objects look squashed or cut off near the camera."
type = "float"
default = 0.12
min = 0.03
max = 0.3
step = 0.01

[[options]]
id = "water_quality"
name = "Water quality"
description = "Fine control for water only. The global Presets option caps this level; disabled: no water effects; low: flat mirror; normal: rippled mirror with colored sheen; enhanced: sharper glitter and stronger colored sheen."
type = "choice"
values = ["disabled", "low", "normal", "enhanced"]
default = "enhanced"

[[options]]
id = "final_saturation_enabled"
name = "Enable final saturation"
description = "Saturation of the finished picture."
type = "bool"
default = true

[[options]]
id = "final_contrast_enabled"
name = "Enable final contrast"
description = "Contrast of the finished picture."
type = "bool"
default = true

[[options]]
id = "soft_shoulder_enabled"
name = "Enable soft shoulder"
description = "Gentle highlight shoulder before Horizon's HDR tone curve."
type = "bool"
default = true

[[options]]
id = "vignette_enabled"
name = "Enable vignette"
description = "Slight darkening at the corners of the screen."
type = "bool"
default = true

[[options]]
id = "saturation"
name = "Final saturation"
description = "Saturation of the finished picture."
type = "float"
default = 1.12
min = 0.8
max = 1.6
step = 0.02

[[options]]
id = "contrast"
name = "Final contrast"
description = "Contrast of the finished picture."
type = "float"
default = 1.04
min = 0.8
max = 1.3
step = 0.02

[[options]]
id = "vignette"
name = "Vignette"
description = "Darkens the corners of the screen slightly."
type = "float"
default = 0.22
min = 0.0
max = 0.6
step = 0.02

[budget]
gpu_ms = 1.5
